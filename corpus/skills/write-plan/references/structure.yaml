# Declarative contract for write-plan skill outputs and inputs.

schema_version: 3
skill: write-plan
family_members:
  - write-plan-start
  - write-plan-amend

input_modes:
  - id: from_adr
    description: ADR directory or files under decisions/
  - id: from_artifacts
    description: Checklist, handoff, Final requirements, status
  - id: from_reflection
    description: Reflection doc actionable section
  - id: from_design
    description: design.md or equivalent goals/stages

planning_roots:
  dev_infra_feature:
    base_glob: "admin/services/{service}/features/{feature}/"
    default_subdir: planning
    staged_planning_subdir_pattern: "planning-stage{N}/"
  catdog_scratch_feature:
    description: CatdogServices-style project/feature scratch
    base_glob: "{project}/{feature}/"
    default_subdir: planning
    staged_planning_subdir_pattern: "planning-stage{N}/"
  template_project:
    base_glob: "docs/maintainers/planning/features/{feature}/"

start_output:
  skill_invocation: write-plan-start
  creates_self_sufficient_plan: true
  directories:
    - path: tasks
      naming: "{nn}-{group-slug}.md"
  singletons:
    - filename: implementation-plan.md
    - filename: status-and-next-steps.md
  group_file_template: assets/task-group-ready.md
  group_file_initial_status: "✅ Ready (or 🟡 Needs authority)"

amend_output:
  skill_invocation: write-plan-amend
  mutates_existing_only: true
  kinds:
    - add_group
    - deepen
    - fix_sync
    - readiness
  deepen_template: assets/task-group-expanded-template.md

implementation_plan_frontmatter:
  required_keys:
    - task_count
    - groups
    - tasks_files
  group_entry_shape:
    name: string
    file: string
    tasks: list_of_integers
  tasks_files_must_match_groups: >
    tasks_files MUST list groups[].file in the SAME order as groups[]; each
    declared file occurs exactly once.
