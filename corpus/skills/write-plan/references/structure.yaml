# Declarative contract for write-plan skill outputs and inputs.

schema_version: 4
skill: write-plan
family_members:
  - write-plan-start
  - write-plan-amend

input_modes:
  - id: from_adr
    description: ADR directory or files under decisions/
  - id: from_artifacts
    description: Checklist, handoff, Final requirements, status
  - id: from_reflection
    description: Reflection doc actionable section
  - id: from_design
    description: design.md or equivalent goals/stages

# Where the planning tree is rooted on disk (topic-first; resolve once per
# invocation). Planning lives beside the rest of the line of work at
# <thinking_root>/<topic>/planning/. Root resolution is owned by the
# artifacts-live-with-the-work principle.
planning_roots:
  resolution:
    principle: artifacts-live-with-the-work
    config_file: "${XDG_CONFIG_HOME:-$HOME/.config}/cursor-skills/config.yaml"
    key: thinking_root
    order:
      - "repos.<slug>.thinking_root (slug = basename of git remote origin, no .git)"
      - "top-level thinking_root"
      - "default: .scratch"
    thinking_root_default: .scratch
    recommended_tracked_root: docs/maintainers
  topic_subtree:
    description: Planning tree beside exploration.md / research/ / decisions/
    base_glob: "{thinking_root}/{topic}/"
    default_subdir: planning
    staged_planning_subdir_pattern: "planning-stage{N}/"
    notes: |
      N is a 1-based positive integer (1, 2, 3, …). Directory name is literal prefix
      "planning-stage" plus decimal digits (no zero-padding required): planning-stage3,
      planning-stage12, etc.
  legacy_artifact_first:
    description: Pre-config layouts. Work in place if a plan already exists there; do not migrate silently.
    base_globs:
      - "docs/maintainers/planning/features/{feature}/"
      - "admin/services/{service}/features/{feature}/planning/"
      - "{project}/{feature}/planning/"

start_output:
  skill_invocation: write-plan-start
  creates_self_sufficient_plan: true
  directories:
    - path: tasks
      naming: "{nn}-{group-slug}.md"
  singletons:
    - filename: implementation-plan.md
    - filename: status-and-next-steps.md
  group_file_template: assets/task-group-ready.md
  group_file_initial_status: "✅ Ready (or 🟡 Needs authority)"

amend_output:
  skill_invocation: write-plan-amend
  mutates_existing_only: true
  kinds:
    - add_group
    - deepen
    - fix_sync
    - readiness
  deepen_template: assets/task-group-expanded-template.md

implementation_plan_frontmatter:
  required_keys:
    - task_count
    - groups
    - tasks_files
  group_entry_shape:
    name: string
    file: string
    tasks: list_of_integers
  tasks_files_must_match_groups: >
    tasks_files MUST list groups[].file in the SAME order as groups[]; each
    declared file occurs exactly once.
